[workspace]
resolver = "3"
members = ["crates/art", "crates/cli", "crates/config", "crates/data"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93.0"
version = "3.0.0"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = { version = "3.27" }
toml = { version = "1.1" }

